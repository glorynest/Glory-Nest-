<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Journey | Glory Nest</title>
<style>
:root{--cream:#faf7ef;--green:#315b43;--leaf:#6d8b65;--ink:#26372b;--line:#e5e4d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{text-align:center;padding:28px 16px;background:linear-gradient(140deg,#e9f0df,#faf7ef)}h1,h2,h3{color:var(--green)}main{max-width:1050px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.toolbar input,.toolbar select{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.story,#detail{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:16px}.story{cursor:pointer}.art {
  height: 150px;
  overflow: hidden;
  border-radius: 12px;
  margin-bottom: 10px;
  background: linear-gradient(145deg, #e4edda, #f8e8cb);
}

.art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;}

.detailart img {
  width: 100%;
  max-height: 360px;
  object-fit: cover;
  border-radius: 16px;}
  .verse,.quiz{padding:12px;background:#f0f4e9;border-radius:12px;margin:12px 0}textarea{width:100%;min-height:90px}.quiz label{display:block;padding:4px}.bar{height:6px;background:#e7eadd;border-radius:9px;margin-top:9px}.bar span{display:block;background:var(--leaf);height:100%}.muted{color:#637461;font-size:.9rem}
</style></head><body><header><h1>🌿 Bible Journey</h1><p>Walk through Scripture, one story at a time. Read, reflect, and discover how God’s Word speaks into everyday life.</p></header><main>
<div class="toolbar"><input id="search" placeholder="Search stories or themes…"><select id="filter"><option value="all">All stories</option><option value="done">Completed</option><option value="todo">Not completed</option></select></div><section id="detail"></section><section id="stories" class="grid"></section><p class="muted">Progress and reflections are saved locally on this device.</p></main>
<script>
const stories = [
"creation.png",
  "noahs-ark.png",
  "abraham.png",
  "joseph.png",
  "burning-bush.png",
  "red-sea.png",
  "ten-commandments.png",
  "jericho.png",
  "david-goliath.png",
  "daniel-lions.png",
  "esther.png",
  "jonah.png",
  "jesus-birth.png",
  "calms-storm.png",
  "feeding-5000.png",
  "good-samaritan.png",
  "prodigal-son.png",
  "triumphal-entry.png",
  "crucifixion.png",
  "resurrection.png"];
const KEY="gloryNestBibleJourney";let state=JSON.parse(localStorage.getItem(KEY)||"{}");const E=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render() {
  let term = E("search").value.toLowerCase();
  let f = E("filter").value;

  E("stories").innerHTML = stories
    .map((s, i) => ({ s, i }))
    .filter(x =>
      x.s.join(" ").toLowerCase().includes(term) &&
      (
        f === "all" ||
        (f === "done" && state[x.i]?.done) ||
        (f === "todo" && !state[x.i]?.done)
      )
    )
    .map(({ s, i }) => `
      <article class="story" onclick="openStory(${i})">

        <div class="art">
          <img
            src="images/bible-journey/${storyImages[i]}"
            alt="${s[0]}"
            loading="lazy"
            onerror="this.style.display='none'"
          >
        </div>

        <small>${String(i + 1).padStart(2, "0")} · ${s[1]}</small>

        <h3>${s[0]}</h3>

        <div>${s[3]}</div>

        <div class="bar">
          <span style="width:${state[i]?.done ? 100 : 0}%"></span>
        </div>

      </article>
    `)
    .join("");
}
function openStory(i) {
  let s = stories[i];
  let d = state[i] || {};

  E("detail").style.display = "block";

  E("detail").innerHTML = `
    <button class="secondary" onclick="closeStory()">← All stories</button>

    <div class="detailart">
      <img
        src="images/bible-journey/${storyImages[i]}"
        alt="${s[0]}"
        loading="lazy"
        onerror="this.style.display='none'"
      >
    </div>

    <small>${s[1]}</small>

    <h2>${s[0]}</h2>

    <p>${s[3]}</p>

    <div class="verse">
      <b>Reflection</b><br>
      ${s[4]}
    </div>

    <label><b>Your reflection</b></label>

    <textarea id="note" placeholder="What stands out to you?">${d.note || ""}</textarea>

    <div class="quiz">
      <b>Quick check</b>
      <p>${s[5]}</p>

      ${s[6].map((o, j) => `
        <label>
          <input
            type="radio"
            name="ans"
            value="${j}"
            ${d.answer === j ? "checked" : ""}
          >
          ${o}
        </label>
      `).join("")}

      <p id="feedback">
        ${d.answer !== undefined
          ? (d.answer === s[7] ? "Correct!" : "Try again — read the story once more.")
          : ""}
      </p>

      <button onclick="check(${i})">Check answer</button>
    </div>

    <button onclick="complete(${i})">
      ${d.done ? "Completed ✓" : "Mark story complete"}
    </button>

    <button class="secondary" onclick="saveNote(${i})">
      Save reflection
    </button>
  `;

  E("detail").scrollIntoView({ behavior: "smooth" });
}
function closeStory(){E("detail").style.display="none"}
function check(i){let v=document.querySelector('input[name="ans"]:checked');if(!v){E("feedback").textContent="Choose an answer first.";return}state[i]=state[i]||{};state[i].answer=+v.value;E("feedback").textContent=+v.value===stories[i][7]?"Correct!":"Try again — read the story once more.";save()}
function complete(i){state[i]=state[i]||{};state[i].done=true;save();render();openStory(i)}
function saveNote(i){state[i]=state[i]||{};state[i].note=E("note").value;save();E("feedback").textContent="Reflection saved on this device."}
E("search").addEventListener("input",render);E("filter").addEventListener("change",render);render();
</script></body></html> update and give
