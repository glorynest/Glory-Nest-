<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Journey | Glory Nest</title>
<style>
:root{--cream:#faf7ef;--green:#315b43;--leaf:#6d8b65;--ink:#26372b;--line:#e5e4d8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{text-align:center;padding:28px 16px;background:linear-gradient(140deg,#e9f0df,#faf7ef)}h1,h2,h3{color:var(--green)}main{max-width:1050px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.toolbar input,.toolbar select{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.story,#detail{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:16px}.story{cursor:pointer}.art{height:105px;display:grid;place-items:center;font-size:48px;background:linear-gradient(145deg,#e4edda,#f8e8cb);border-radius:12px;margin-bottom:10px}button{border:0;border-radius:11px;padding:10px 14px;background:var(--green);color:white;font:inherit;cursor:pointer;margin:4px}.secondary{background:#e8eee2;color:var(--green)}#detail{display:none;margin-bottom:20px}.detailart{text-align:center;font-size:64px}.verse,.quiz{padding:12px;background:#f0f4e9;border-radius:12px;margin:12px 0}textarea{width:100%;min-height:90px}.quiz label{display:block;padding:4px}.bar{height:6px;background:#e7eadd;border-radius:9px;margin-top:9px}.bar span{display:block;background:var(--leaf);height:100%}.muted{color:#637461;font-size:.9rem}
</style></head><body><header><h1>🌿 Bible Journey</h1><p>Walk through Scripture, one story at a time. Read, reflect, and discover how God’s Word speaks into everyday life.</p></header><main>
<div class="toolbar"><input id="search" placeholder="Search stories or themes…"><select id="filter"><option value="all">All stories</option><option value="done">Completed</option><option value="todo">Not completed</option></select></div><section id="detail"></section><section id="stories" class="grid"></section><p class="muted">Progress and reflections are saved locally on this device.</p></main>
<script>
const stories = [
["Creation","Genesis 1","🌍","God creates the heavens, earth, and all living things, and sees that creation is good.","Every part of creation has value.","What did God create in the beginning?",["The heavens and earth","A palace","A ship"],0],
["Noah’s Ark","Genesis 6–9","🛶","Noah trusts God and builds an ark. His family and the animals are kept safe through the flood.","Trust and obedience matter, even when the path is difficult.","What sign reminds Noah of God’s covenant?",["A rainbow","A crown","A dove"],0],
["Abraham’s Promise","Genesis 12; 15; 21","✨","God calls Abraham and promises him a family as numerous as the stars.","Trust God beyond what you can see.","What did God promise Abraham?",["A palace","Many descendants","A large army"],1],
["Joseph and His Dreams","Genesis 37–50","🌈","Joseph faces betrayal and hardship, yet God raises him to save many lives.","God can bring good from painful circumstances.","Where did Joseph serve as a ruler?",["Egypt","Canaan","Babylon"],0],
["The Burning Bush","Exodus 3–4","🔥","God speaks to Moses from a burning bush and calls him to lead Israel out of Egypt.","God can call ordinary people to meaningful work.","What was unusual about the bush?",["It spoke","It burned without being consumed","It grew underwater"],1],
["The Red Sea","Exodus 14","🌊","God makes a way through the sea, and the Israelites cross safely as they leave Egypt.","When the way seems blocked, trust God and take the next faithful step.","What helped divide the waters?",["A strong wind","A bridge","A boat"],0],
["The Ten Commandments","Exodus 19–20","📜","At Mount Sinai, God gives Israel commandments to guide worship and life together.","God’s guidance shapes a life of love and faithfulness.","Where did Moses receive the commandments?",["Mount Sinai","Mount Carmel","Jericho"],0],
["The Walls of Jericho","Joshua 6","🏰","Israel follows God’s instructions, and the walls of Jericho fall after the people march around the city.","Faithfulness may mean following an unexpected path.","What did the Israelites do around Jericho?",["Marched","Sailed","Built a wall"],0],
["David and Goliath","1 Samuel 17","🪨","Young David faces the giant Goliath, trusting not in armor but in the Lord.","Courage grows when we remember who stands with us.","What did David use?",["A sling and stone","A sword","A spear"],0],
["Daniel and the Lions","Daniel 6","🦁","Daniel keeps praying and is thrown into a lions’ den. God protects him.","Keep faith and integrity under pressure.","Why was Daniel thrown into the den?",["He kept praying","He fought the king","He left town"],0],
["Esther’s Courage","Esther 4–7","👑","Queen Esther risks her safety to speak up for her people.","Courage can mean using your voice to protect others.","For whom did Esther speak?",["Her people","The army","The merchants"],0],
["Jonah and the Great Fish","Jonah 1–4","🐋","Jonah runs from God’s call, but returns and delivers God’s message after the fish releases him.","God is patient and offers second chances.","Where did Jonah go to deliver God’s message?",["Nineveh","Jerusalem","Egypt"],0],
["The Birth of Jesus","Luke 2:1–20","⭐","Jesus is born in Bethlehem. Angels announce the good news to shepherds.","God’s gift came in humility and love.","Where was Jesus born?",["Bethlehem","Nazareth","Jericho"],0],
["Jesus Calms the Storm","Mark 4:35–41","⛵","A storm frightens the disciples, but Jesus commands the wind and waves to be still.","Jesus is present with us in life’s storms.","What did Jesus tell the storm?",["Be still","Go away","Come closer"],0],
["Jesus Feeds Five Thousand","John 6:1–14","🍞","Jesus blesses five loaves and two fish, feeding a great crowd with food left over.","Offer what you have; God can use it in surprising ways.","What food did the boy bring?",["Five loaves and two fish","Seven cakes","Grapes"],0],
["The Good Samaritan","Luke 10:25–37","🤝","A Samaritan cares for a wounded traveler when others pass by.","Love your neighbor through practical compassion.","Who acted as the neighbor?",["The Samaritan","The priest","The traveler"],0],
["The Prodigal Son","Luke 15:11–32","🏡","A father welcomes his returning son with compassion and celebration.","God’s mercy welcomes those who turn back.","How did the father respond?",["Welcomed him joyfully","Sent him away","Ignored him"],0],
["The Triumphal Entry","Matthew 21:1–11","🌿","Jesus enters Jerusalem as people welcome Him with branches and praise.","Welcome Jesus with a humble and sincere heart.","What did the crowd spread on the road?",["Cloaks and branches","Coins","Sand"],0],
["The Crucifixion","Luke 23; John 19","✝️","Jesus gives His life on the cross, showing God’s love and making the way for forgiveness.","The cross reveals the depth of God’s love.","Where was Jesus crucified?",["Golgotha","Bethlehem","Capernaum"],0],
["The Resurrection","Matthew 28; John 20","🌅","On the third day, Jesus rises. The empty tomb brings hope and new life.","The resurrection is the heart of Christian hope.","What did the women find at the tomb?",["The stone rolled away","A sealed door","A sleeping guard"],0]
];
const KEY="gloryNestBibleJourney";let state=JSON.parse(localStorage.getItem(KEY)||"{}");const E=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){let term=E("search").value.toLowerCase(),f=E("filter").value;E("stories").innerHTML=stories.map((s,i)=>({s,i})).filter(x=>x.s.join(" ").toLowerCase().includes(term)&&(f==="all"||(f==="done"&&state[x.i]?.done)||(f==="todo"&&!state[x.i]?.done))).map(({s,i})=>`<article class="story" onclick="openStory(${i})"><div class="art">${s[2]}</div><small>${String(i+1).padStart(2,"0")} · ${s[1]}</small><h3>${s[0]}</h3><div>${s[3]}</div><div class="bar"><span style="width:${state[i]?.done?100:0}%"></span></div></article>`).join("")}
function openStory(i){let s=stories[i],d=state[i]||{};E("detail").style.display="block";E("detail").innerHTML=`<button class="secondary" onclick="closeStory()">← All stories</button><div class="detailart">${s[2]}</div><small>${s[1]}</small><h2>${s[0]}</h2><p>${s[3]}</p><div class="verse"><b>Reflection</b><br>${s[4]}</div><label><b>Your reflection</b></label><textarea id="note" placeholder="What stands out to you?">${d.note||""}</textarea><div class="quiz"><b>Quick check</b><p>${s[5]}</p>${s[6].map((o,j)=>`<label><input type="radio" name="ans" value="${j}" ${d.answer===j?"checked":""}> ${o}</label>`).join("")}<p id="feedback">${d.answer!==undefined?(d.answer===s[7]?"Correct!":"Try again — read the story once more."):""}</p><button onclick="check(${i})">Check answer</button></div><button onclick="complete(${i})">${d.done?"Completed ✓":"Mark story complete"}</button><button class="secondary" onclick="saveNote(${i})">Save reflection</button>`;E("detail").scrollIntoView({behavior:"smooth"})}
function closeStory(){E("detail").style.display="none"}
function check(i){let v=document.querySelector('input[name="ans"]:checked');if(!v){E("feedback").textContent="Choose an answer first.";return}state[i]=state[i]||{};state[i].answer=+v.value;E("feedback").textContent=+v.value===stories[i][7]?"Correct!":"Try again — read the story once more.";save()}
function complete(i){state[i]=state[i]||{};state[i].done=true;save();render();openStory(i)}
function saveNote(i){state[i]=state[i]||{};state[i].note=E("note").value;save();E("feedback").textContent="Reflection saved on this device."}
E("search").addEventListener("input",render);E("filter").addEventListener("change",render);render();
</script></body></html>
